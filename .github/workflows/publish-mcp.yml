# Publishes server.json to the official MCP Registry.
#
# Why this exists: the registry entry sat at v0.1.0 while the deployed server was
# on v0.5.0, because publishing needed an interactive GitHub device login that
# only a human could complete, and the token expired after every session. In an
# ecosystem where more than half of listed servers are dead, a stale version is
# the main signal people read as "abandoned" — so the manual step was not a minor
# inconvenience, it was actively misrepresenting the project.
#
# OIDC removes the human entirely: GitHub mints a short-lived identity token for
# this workflow, and the registry trusts it because it can verify the repository
# it came from. No stored secret, nothing to expire, nothing to re-run by hand.

name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only when the manifest itself changes, so ordinary commits don't republish.
    paths: ["server.json"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for github-oidc login; without it the login fails
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # Pinned rather than "latest": an unpinned release could change what
          # publishes without any commit here, which is exactly the kind of silent
          # change the axe-core pin in src/index.js also guards against.
          VERSION=v1.8.1
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Confirm what the registry now shows
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=render-mcp&limit=20" \
            | grep -o '"version":"[^"]*"' | head -5 || true
